  :root{
    --ink:#483234;
    --paper:#FFFFFF;
    --cream:#fef7c6;
    --band:#EFEFEF;
    --shelf:#dcc4a2;
    --t-display:#b6b480;
    --t-sort:#d5e1fc;
    --t-hide:#7f231f;
    --t-minimal:#dcc4a2;
    --mute:rgba(72,50,52,0.6);
    --hair:rgba(72,50,52,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    transition:background .3s ease;
    word-break:keep-all;
  }
  body.cream-stage{ background:var(--cream); }

  .app{ width:100%; max-width:640px; min-height:640px; display:flex; flex-direction:column; }

  .topbar{ position:relative; display:flex; align-items:center; justify-content:center; padding-bottom:20px; margin-bottom:32px; transition:opacity .2s ease; }
  .topbar.hide{ display:none; }
  .brand{ width:76px; height:auto; }
  .brand svg{ display:block; width:100%; height:auto; }

  .screen{ flex:1; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  .intro{ align-items:center; text-align:center; }
  .intro h1{ font-size:46px; line-height:1.2; font-weight:700; margin:8px 0 16px; letter-spacing:-0.02em; color:#000000; white-space:nowrap; }
  .intro p{ font-size:16px; line-height:1.5; color:#000000; opacity:0.6; margin:0 0 32px; font-weight:500; }

  .hero-cycle{ display:flex; align-items:center; justify-content:center; gap:18px; margin:44px 0 48px; }
  .bracket{ font-family:'Pretendard', -apple-system, sans-serif; font-weight:600; font-size:38px; color:var(--ink); line-height:1; }
  .drawer-chip{ position:relative; width:230px; height:64px; overflow:visible; perspective:700px; }
  .hero-layer{ position:absolute; inset:0; backface-visibility:hidden; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.65,0,.35,1), opacity .6s ease, filter .6s ease; }
  .hero-layer svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hero-layer span{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; height:100%; font-weight:600; font-size:18px; color:var(--ink); }

  .name-field{
    width:100%; max-width:300px; height:52px; border:1px solid var(--ink); border-radius:10px;
    font-family:inherit; font-size:16px; text-align:center; margin-bottom:14px; background:var(--paper); color:var(--ink);
  }
  .name-field::placeholder{ color:rgba(72,50,52,0.3); }
  .name-field:focus{ outline:none; border-color:var(--shelf); box-shadow:0 0 0 3px rgba(196,150,105,0.3); }
  button.cta{
    width:100%; max-width:300px; height:52px; border-radius:10px; border:none;
    background:var(--ink); color:var(--paper); font-family:inherit; font-weight:600; font-size:16px; cursor:pointer;
  }

  .q-progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .q-progress-badge{ flex-shrink:0; background:rgba(72,50,52,0.2); color:var(--ink); font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; font-family:'Pretendard', -apple-system, sans-serif; }
  .q-progress-track{ flex:1; height:5px; background:#F4F4F4; border-radius:999px; }
  .q-progress-fill{ height:100%; background:var(--ink); border-radius:999px; transition:width .35s ease; }
  .q-label{ text-align:center; font-weight:700; font-size:22px; color:var(--ink); margin-bottom:14px; letter-spacing:0.02em; }
  .q-text{ text-align:center; font-size:22px; line-height:1.4; font-weight:700; letter-spacing:-0.01em; margin-bottom:32px; min-height:120px; color:#1E1E1D; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    text-align:center; background:var(--paper); border:1px solid #B8B8B8; border-radius:14px;
    padding:18px 20px; font-family:inherit; font-size:15px; line-height:1.4; color:#1E1E1D;
    cursor:pointer; transition:background .2s ease, border-color .2s ease;
  }
  .option.chosen{ background:var(--cream); border-color:var(--shelf); color:#483234; font-weight:600; }

  .q-nav{ display:flex; gap:10px; margin-top:auto; padding-top:24px; }
  .q-nav button{ flex:1; height:52px; border-radius:10px; border:none; font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .q-nav .prev{ background:var(--band); color:#1E1E1D; }
  .q-nav .prev:disabled{ opacity:0.4; cursor:default; }
  .q-nav .next{ background:var(--ink); color:var(--paper); }
  .q-nav .next:disabled{ opacity:0.4; cursor:default; }

  .loading{ align-items:center; justify-content:center; text-align:center; }
  .loading-swatch{ width:70px; height:70px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; margin-bottom:32px; border-radius:6px; overflow:hidden; }
  .loading-swatch div{ animation:swatchPulse 1.4s ease-in-out infinite; }
  .loading-swatch div:nth-child(1){ background:var(--cream); animation-delay:0s; }
  .loading-swatch div:nth-child(2){ background:var(--shelf); animation-delay:0.15s; }
  .loading-swatch div:nth-child(3){ background:var(--cream); animation-delay:0.3s; }
  .loading-swatch div:nth-child(4){ background:var(--ink); animation-delay:0.45s; }
  @keyframes swatchPulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .loading p{ font-size:20px; font-weight:700; color:#1E1E1D; line-height:1.4; margin:0; }



  .drawer-prompt{ align-items:stretch; text-align:center; flex:1; }
  .prompt-stage{ display:flex; flex-direction:column; padding-top:8%; }

  .pre-header{ font-size:26px; font-weight:700; line-height:1.4; color:#1E1E1D; margin:0 0 36px; }
  .post-header{ display:none; width:100%; max-width:300px; margin:0 auto 40px; }
  .post-header .result-label{ font-size:14px; color:var(--mute); text-align:center; margin-bottom:10px; font-weight:500; }
  .post-header .result-type-line{ display:flex; align-items:center; justify-content:space-between; }
  .post-header .result-type-line .bracket{ font-size:28px; }
  .post-header .result-type-line span.name{ font-size:26px; font-weight:700; color:#1E1E1D; }

  .door-stage{
    position:relative; width:100%; max-width:300px; aspect-ratio:600/450; overflow:hidden;
    margin:0 auto;
  }
  .result-illustration-bg{ position:absolute; inset:0; }
  .result-illustration-bg svg{ width:100%; height:100%; display:block; }
  .drawer-panel{
    position:absolute; inset:0; background:var(--shelf); border-radius:9px; cursor:pointer; touch-action:none;
    transition:transform .55s cubic-bezier(.4,0,.2,1);
  }
  .drawer-panel.dragging{ cursor:grabbing; transition:none; }
  .handle-bar{ position:absolute; left:11.4%; top:37.4%; bottom:37.4%; width:6px; background:var(--ink); border-radius:3px; pointer-events:none; }
  .arrow-svg-wrap{ position:absolute; left:20.06%; top:50%; width:36.7%; transform:translateY(-50%); animation:arrowGrow 1.7s ease-in-out infinite; pointer-events:none; }
  .arrow-svg-wrap svg{ width:100%; height:auto; display:block; }
  @keyframes arrowGrow{
    0%{ clip-path: inset(0 100% 0 0); }
    65%{ clip-path: inset(0 0% 0 0); }
    100%{ clip-path: inset(0 0% 0 0); }
  }
  .drawer-hint{ font-size:17px; color:#1E1E1D; margin-top:40px; font-weight:400; }
  .drawer-hint.hidden{ display:none; }

  .result-text{ display:none; opacity:0; transition:opacity .5s ease; }
  .result-text.show{ display:block; }
  .result-text.show.visible{ opacity:1; }

  .result-formula{ font-size:18px; font-weight:700; color:#1E1E1D; text-align:center; margin:40px auto 16px; max-width:500px; }
  .result-desc{ font-size:15px; line-height:1.7; color:#1E1E1D; text-align:center; margin:0 auto 44px; max-width:500px; }

  .distribution{ border:1px solid rgba(30,30,29,0.12); border-radius:16px; padding:20px; margin:0 auto 60px; max-width:500px; display:flex; flex-direction:column; gap:16px; }
  .dist-row{ display:flex; align-items:center; gap:12px; }
  .dist-icon{ flex-shrink:0; width:22px; height:22px; }
  .dist-label{ flex-shrink:0; width:78px; text-align:left; white-space:nowrap; font-size:13px; font-weight:600; color:#1E1E1D; }
  .dist-icon svg{ width:100%; height:100%; display:block; }
  .dist-bar{ flex:1; height:8px; background:#F4F4F4; border-radius:999px; position:relative; }
  .dist-bar-fill{ position:absolute; left:0; top:0; height:100%; border-radius:999px; }
  .dist-pct{ flex-shrink:0; width:44px; text-align:right; font-family:'FrutigerLTPro-Bold','Pretendard',sans-serif; font-weight:700; font-size:14px; color:#1E1E1D; }

  .pill-header{ background:var(--ink); color:var(--paper); font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px; display:inline-block; margin:0 auto 20px; }
  .result-section{ margin-bottom:60px; text-align:center; }
  .result-section ul{ list-style:none; margin:0 auto; padding:0; text-align:left; max-width:500px; }
  .result-section li{ font-size:14.5px; line-height:1.75; color:#1E1E1D; margin-bottom:15px; padding-left:16px; position:relative; }
  .result-section li::before{ content:'•'; position:absolute; left:0; color:var(--mute); }

  .rec-items{ display:flex; gap:16px; justify-content:center; max-width:500px; margin:0 auto; }
  .rec-item{ flex:1; max-width:152px; text-align:center; }
  .rec-item .thumb{ width:100%; aspect-ratio:1; background:var(--cream); border-radius:14px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; padding:14px; }
  .rec-item .thumb img{ width:100%; height:100%; object-fit:contain; display:block; }
  .rec-item .tag{
    display:inline-block; font-size:11.5px; color:#1E1E1D; font-family:'Pretendard', -apple-system, sans-serif;
    font-weight:500; background:#F4F4F4; padding:6px 10px; border-radius:999px;
  }

  @media (max-width:480px){
    .intro h1{ font-size:32px; }
    .q-text{ font-size:20px; min-height:130px; }
    .result-type-line span.name{ font-size:22px; }
    .drawer-prompt h1{ font-size:22px; }
  }
</style>
</head>

let heroIndex = 0;
let heroActive = 'a';

function buildHeroTrack(){
  const chip = document.getElementById('hero-chip');
  chip.innerHTML = `
    <div class="hero-layer" id="hero-a" style="transform:rotateX(0deg); opacity:1;">
      <svg viewBox="0 0 1200 450" preserveAspectRatio="none"><path id="hero-a-path" d="${NOTCH_PATH}" style="fill:${TYPE_COLORS.sort}"/></svg>
      <span id="hero-a-text">${HERO_LABELS[0]}</span>
    </div>
    <div class="hero-layer" id="hero-b" style="transform:rotateX(100deg); opacity:0;">
      <svg viewBox="0 0 1200 450" preserveAspectRatio="none"><path id="hero-b-path" d="${NOTCH_PATH}" style="fill:${TYPE_COLORS.sort}"/></svg>
      <span id="hero-b-text">${HERO_LABELS[1]}</span>
    </div>
  `;
  heroIndex = 0;
  heroActive = 'a';
  setInterval(cycleHero, 2200);
}

function cycleHero(){
  const curId = heroActive;
  const nextId = curId === 'a' ? 'b' : 'a';
  const curEl = document.getElementById('hero-' + curId);
  const nextEl = document.getElementById('hero-' + nextId);
  const nextIndex = (heroIndex + 1) % HERO_LABELS.length;

  document.getElementById('hero-' + nextId + '-text').textContent = HERO_LABELS[nextIndex];
  document.getElementById('hero-' + nextId + '-path').style.fill = TYPE_COLORS.sort;
  nextEl.style.transition = 'none';
  nextEl.style.transform = 'rotateX(100deg)';
  nextEl.style.opacity = '0';
  nextEl.style.filter = 'brightness(0.6)';
  void nextEl.offsetWidth;
  nextEl.style.transition = '';

  curEl.style.transform = 'rotateX(-100deg)';
  curEl.style.opacity = '0';
  curEl.style.filter = 'brightness(0.6)';
  nextEl.style.transform = 'rotateX(0deg)';
  nextEl.style.opacity = '1';
  nextEl.style.filter = 'brightness(1)';

  heroIndex = nextIndex;
  heroActive = nextId;
}

let current = 0;
let answers = [];
let userName = '';

function honorific(){
  return userName ? `${userName}님` : '당신';
}

function personalize(text){
  if(!userName) return text;
  const h = honorific();
  return text
    .replace(/당신에게/g, `${h}에게`)
    .replace(/당신이/g, `${h}이`)
    .replace(/당신의/g, `${h}의`)
    .replace(/당신/g, h);
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector('.topbar').classList.toggle('hide', id !== 'screen-intro');
  if(id === 'screen-intro'){
    document.body.classList.add('cream-stage');
  } else if(id === 'screen-question' || id === 'screen-loading'){
    document.body.classList.remove('cream-stage');
  }
}

function startTest(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  userName = document.getElementById('name-input').value.trim();
  show('screen-question');
  renderQuestion();
}

function renderQuestion(){
  const item = QUESTIONS[current];
  document.getElementById('q-label').textContent = `Q${current+1}`;
  document.getElementById('q-progress-fill').style.width = `${(current/QUESTIONS.length)*100}%`;
  document.getElementById('q-progress-count').textContent = `${current+1}/${QUESTIONS.length}`;
  document.getElementById('q-text').textContent = personalize(item.q);

  const wrap = document.getElementById('q-options');
  wrap.innerHTML = '';
  item.options.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    if(answers[current] === TYPE_ORDER[i]) btn.classList.add('chosen');
    btn.textContent = opt;
    btn.onclick = ()=> selectAnswer(i, btn);
    wrap.appendChild(btn);
  });

  document.getElementById('q-next').disabled = (answers[current] === null);
}

function selectAnswer(i, btn){
  document.querySelectorAll('#q-options .option').forEach(o=> o.classList.remove('chosen'));
  btn.classList.add('chosen');
  answers[current] = TYPE_ORDER[i];
  document.getElementById('q-next').disabled = false;
}

function goPrev(){
  if(current === 0){
    show('screen-intro');
    return;
  }
  current--;
  renderQuestion();
}

function goNext(){
  if(answers[current] === null) return;
  current++;
  if(current < QUESTIONS.length){
    renderQuestion();
  } else {
    document.getElementById('q-progress-fill').style.width = '100%';
    finishQuiz();
  }
}

function finishQuiz(){
  show('screen-loading');
  setTimeout(prepareResult, 2600);
}

function buildInterior(type){

const DIST_ICON_SVG = {
  display: `<svg viewBox="0 0 43 43" xmlns="http://www.w3.org/2000/svg"><circle cx="21.0625" cy="21.0625" r="21.0625" fill="#483234"/><path d="M19.5879 19.9067V22.8501H8.79883V19.9067H19.5879ZM33.3252 22.8501H22.5332V19.9067H33.3252V22.8501Z" fill="#fffedb"/><path d="M22.5312 33.6416H19.5889V22.8506H22.5312V33.6416ZM19.5889 22.8506H19.5879V19.9072H19.5889V22.8506ZM22.5332 22.8506H22.5312V19.9072H22.5332V22.8506ZM22.5312 19.9072H19.5889V9.11523H22.5312V19.9072Z" fill="#fffedb"/></svg>`,
  minimal: `<svg viewBox="0 0 43 43" xmlns="http://www.w3.org/2000/svg"><circle cx="21.0625" cy="21.0625" r="21.0625" fill="#483234"/><rect x="9.08984" y="19.626" width="23.9435" height="2.87322" fill="#fffedb"/></svg>`,

};
let winnerType = null;
let drawerOpened = false;
let dragging = false, startX = 0, currentX = 0, downTime = 0;

function prepareResult(){
  const counts = { display:0, sort:0, hide:0, minimal:0 };
  answers.forEach(a=> counts[a]++);

  const maxCount = Math.max(...TYPE_ORDER.map(k=>counts[k]));
  const tied = TYPE_ORDER.filter(k=>counts[k]===maxCount);
  const lastAnswer = answers[answers.length-1];
  winnerType = tied.length === 1 ? tied[0] : (tied.includes(lastAnswer) ? lastAnswer : tied[0]);

  const t = TYPES[winnerType];

  document.getElementById('r-label').textContent = `${honorific()}의 정리 공식은`;
  document.getElementById('r-name').textContent = t.label;
  document.getElementById('r-illustration').innerHTML = buildInterior(winnerType);
  document.getElementById('r-formula').textContent = t.formula;
  document.getElementById('r-desc').textContent = t.desc;
  document.getElementById('r-personality').innerHTML = t.personality.map(p=>`<li>${p}</li>`).join('');
  document.getElementById('r-caution').innerHTML = t.caution.map(p=>`<li>${p}</li>`).join('');
  document.getElementById('r-tips').innerHTML = t.tips.map(p=>`<li>${p}</li>`).join('');
  document.getElementById('r-tags').innerHTML = t.tags.map((tag, idx)=>`
    <div class="rec-item"><div class="thumb"><img src="${REC_IMAGES[winnerType][idx]}" alt="${tag}"></div><div class="tag">${tag}</div></div>
  `).join('');

  const dist = document.getElementById('r-distribution');
  dist.innerHTML = '';
  DIST_DISPLAY_ORDER.forEach(key=>{
    const pct = Math.round((counts[key] / QUESTIONS.length) * 100);
    const row = document.createElement('div');
    row.className = 'dist-row';
    row.innerHTML = `<div class="dist-icon">${DIST_ICON_SVG[key]}</div><div class="dist-label">${TYPES[key].label}</div><div class="dist-bar"><div class="dist-bar-fill" style="width:${pct}%; background:${TYPE_COLORS.sort}"></div></div><div class="dist-pct">${pct}%</div>`;
    dist.appendChild(row);
  });

  document.getElementById('result-prompt-h1').innerHTML = `${honorific()}의<br>정리 공식이 완성됐어요!`;

  const panel = document.getElementById('drawer-panel');
  panel.style.transition = 'none';
  panel.style.transform = 'translateX(0px)';
  panel.style.pointerEvents = 'auto';
  panel.style.background = TYPE_COLORS.sort;
  requestAnimationFrame(()=>{ panel.style.transition = ''; });

  document.getElementById('drawer-hint').classList.remove('hidden');
  document.getElementById('result-prompt-h1').style.display = '';
  document.getElementById('post-header').style.display = 'none';
  document.getElementById('result-text').classList.remove('show', 'visible');
  drawerOpened = false;

  document.body.classList.add('cream-stage');
  show('screen-result');
}

function initDrawerDrag(){
  const panel = document.getElementById('drawer-panel');

  panel.addEventListener('pointerdown', (e)=>{
    if(drawerOpened) return;
    dragging = true;
    startX = e.clientX;
    currentX = 0;
    downTime = Date.now();
    panel.classList.add('dragging');
    panel.setPointerCapture(e.pointerId);
  });

  panel.addEventListener('pointermove', (e)=>{
    if(!dragging || drawerOpened) return;
    let dx = e.clientX - startX;
    if(dx < 0) dx = 0;
    currentX = dx;
    panel.style.transform = `translateX(${dx}px)`;
  });

  function endDrag(){
    if(!dragging || drawerOpened) return;
    dragging = false;
    panel.classList.remove('dragging');
    const dt = Date.now() - downTime;
    const dx = currentX;
    if(dx > 70 || (dt < 300 && dx < 10)){
      openDrawer();
    } else {
      panel.style.transform = 'translateX(0px)';
    }
    currentX = 0;
  }

  panel.addEventListener('pointerup', endDrag);
  panel.addEventListener('pointercancel', endDrag);
}

function openDrawer(){
  drawerOpened = true;
  document.body.classList.remove('cream-stage');
  document.getElementById('drawer-panel').style.transform = 'translateX(105%)';
  document.getElementById('drawer-hint').classList.add('hidden');
  document.getElementById('result-prompt-h1').style.display = 'none';
  document.getElementById('post-header').style.display = 'block';

  const resultText = document.getElementById('result-text');
  setTimeout(()=>{
    resultText.classList.add('show');
    requestAnimationFrame(()=> resultText.classList.add('visible'));
  }, 350);
}

function restart(){
  show('screen-intro');
}

initDrawerDrag();
buildHeroTrack();
</script>
